name: Release 1.0.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
permissions:
  contents: write
concurrency:
  group: release-1.0.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare TinyCC
        shell: pwsh
        run: ./scripts/install-tinycc.ps1
      - name: Build
        shell: pwsh
        run: ./构建.ps1
      - name: Package and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $PWD 'DeskBox.exe')).Version.ToString()
          if ($version -ne '1.0.0.0') { throw "Unexpected executable version: $version" }
          $existing = gh release view v1.0.0 --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              Write-Host 'Version 1.0.0 is already published; keeping its assets unchanged.'
              exit 0
            }
          }
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item DeskBox.exe,LICENSE -Destination package
          Copy-Item docs/使用说明.md package/USAGE.md
          $asset = 'rushbin-1.0.0-windows-x64.zip'
          Compress-Archive -Path package/* -DestinationPath $asset -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), "$hash  $asset`n", [Text.UTF8Encoding]::new($false))
          gh release view v1.0.0 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0 --target $env:GITHUB_SHA --title 'rushbin 1.0.0' --notes-file docs/releases/1.0.0.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create release draft.' }
          }
          gh release upload v1.0.0 $asset SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release assets.' }
          gh release edit v1.0.0 --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release.' }
